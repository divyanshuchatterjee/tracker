<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tracker</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-icon">✓</span>
            <span>Tracker</span>
        </div>

        <div class="topbar-actions">
            <button id="themeToggle" class="icon-button" onclick="toggleTheme()">
                ☾
            </button>

            <button class="secondary-button" onclick="exportJSON()">
                Export JSON
            </button>

            <label class="secondary-button import-button">
                Import JSON
                <input
                        type="file"
                        id="importFile"
                        accept=".json"
                        onchange="importJSON(event)"
                        hidden
                >
            </label>
        </div>
    </header>


    <!-- BODY -->
    <div class="app-body">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <div>
                    <div class="sidebar-title">Trackers</div>
                    <div class="sidebar-subtitle">
                        Manage your trackers
                    </div>
                </div>

                <button
                        class="add-tracker-button"
                        onclick="addTracker()"
                        title="Add tracker"
                >
                    +
                </button>
            </div>

            <div id="trackerList" class="tracker-list"></div>

        </aside>


        <!-- MAIN -->
        <main class="main-content">

            <div id="mainContent"></div>

        </main>

    </div>

</div>


<!-- SHEET TYPE MODAL -->
<div id="sheetTypeModal" class="sheet-type-modal" aria-hidden="true">
    <div class="sheet-type-dialog" role="dialog" aria-modal="true" aria-labelledby="sheetTypeTitle">
        <div class="sheet-type-header">
            <div>
                <h2 id="sheetTypeTitle">Create new sheet</h2>
                <p>Choose what you want to create.</p>
            </div>
        </div>

        <div class="sheet-type-options">
            <label class="sheet-type-option">
                <input type="checkbox" id="sheetTypeTracker" checked>
                <span class="sheet-type-check"></span>
                <span class="sheet-type-option-text">
                    <strong>Tracker</strong>
                    <small>A table with rows and columns</small>
                </span>
            </label>

            <label class="sheet-type-option">
                <input type="checkbox" id="sheetTypeNotes">
                <span class="sheet-type-check"></span>
                <span class="sheet-type-option-text">
                    <strong>Notes</strong>
                    <small>Cards with rich text blocks</small>
                </span>
            </label>
        </div>

        <div class="sheet-type-actions">
            <button id="sheetTypeCancel" class="secondary-button">Cancel</button>
            <button id="sheetTypeCreate" class="primary-button">Create</button>
        </div>
    </div>
</div>


<!-- TOAST -->
<div id="toast" class="toast"></div>


<!-- IMPORTANT:
     script.js is now an ES module
-->
<script type="module" src="script.js"></script>

</body>
</html>
